# main: images are tagged with the git tag, deploys are manual, and the quality
# gate is blocking rather than advisory.
include:
  - local: '.gitlab/ci/.base.yml'

stages: [verify, analyse, build, deploy]

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"'

variables:
  MAVEN_PROFILE: production
  IMAGE_TAG: ${CI_COMMIT_TAG:-main-$CI_COMMIT_SHORT_SHA}

verify:
  extends: .verify

integration-test:
  extends: .integration-test

sonar:
  extends: .sonar
  needs: [verify]
  # A failing quality gate must stop a production release.
  allow_failure: false

build-image:
  extends: .build-image
  needs: [verify, integration-test]

deploy:
  stage: deploy
  image: alpine:3.21
  needs: [build-image]
  when: manual
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH && TAG=$IMAGE_TAG docker compose pull && TAG=$IMAGE_TAG docker compose up -d"
