# Scrapes the Spring Boot actuator endpoint of each service.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      # host.docker.internal reaches the application running on the host, which
      # is how it is run during development.
      - targets: ["host.docker.internal:8080"]
        labels:
          application: service-template
