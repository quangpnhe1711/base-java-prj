# Local development dependencies.
#
# Only PostgreSQL starts by default, because that is the only thing the service
# cannot run without. Everything else is opt-in through a compose profile:
#
#   docker compose up -d                          PostgreSQL only
#   docker compose --profile auth up -d           + Keycloak
#   docker compose --profile storage up -d        + MinIO
#   docker compose --profile observability up -d  + Prometheus, Grafana, Loki, Zipkin
#   docker compose --profile all up -d            everything
#
# This file starts the infrastructure a service needs, not the service itself:
# run the application from your IDE or with
#   mvn -pl service-template -am spring-boot:run
# so that a restart takes a second rather than a rebuild.
#
# Everything here is disposable. `docker compose down -v` resets all state.

name: base-java-prj

services:
  postgres:
    image: postgres:16-alpine
    container_name: base-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: base_java_prj
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Keycloak gets its own database in the same instance; one Postgres is
      # enough for a developer machine.
      POSTGRES_MULTIPLE_DATABASES: keycloak
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    # Optional. The service runs without it when app.security.enabled is false.
    profiles: ["auth", "all"]
    image: quay.io/keycloak/keycloak:26.1
    container_name: base-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realms:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    # Optional. Needed only by services that depend on common-storage.
    profiles: ["storage", "all"]
    # Speaks the S3 API, so local and production storage share one code path.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: base-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    profiles: ["storage", "all"]
    # Creates the bucket once, then exits. Without it the first upload fails.
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: base-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/base-local &&
      echo 'bucket ready'
      "

  zipkin:
    profiles: ["observability", "all"]
    image: openzipkin/zipkin:3
    container_name: base-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"

  prometheus:
    profiles: ["observability", "all"]
    image: prom/prometheus:v3.3.0
    container_name: base-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    profiles: ["observability", "all"]
    image: grafana/loki:3.4.2
    container_name: base-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro

  promtail:
    profiles: ["observability", "all"]
    image: grafana/promtail:3.4.2
    container_name: base-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    profiles: ["observability", "all"]
    image: grafana/grafana:11.6.0
    container_name: base-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

volumes:
  postgres-data:
  minio-data:
