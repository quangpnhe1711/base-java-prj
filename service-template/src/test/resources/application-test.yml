# Test profile. The datasource itself is supplied by Testcontainers through
# @ServiceConnection, so nothing about connectivity belongs here.

spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
